name: ci

on:
  push:
    branches: ["review/**"]
  pull_request:

permissions:
  contents: read

jobs:
  kotlin-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: test core
        run: gradle :core:test --no-daemon
      - name: phase sweep table
        if: always()
        run: cat core/build/phase-sweep.md || echo "no sweep table written"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-core-report
          path: |
            core/build/phase-sweep.md
            core/build/reports/tests
